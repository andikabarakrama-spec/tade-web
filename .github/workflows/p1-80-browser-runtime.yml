name: TADE P1-80 Browser Runtime Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  p1-80-playwright:
    name: Playwright Chromium Browser Execution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start Vite Dev Server
        run: |
          npm run dev -- --host 0.0.0.0 &
          npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Run Playwright P1-80 Browser Runtime Tests
        env:
          TEST_SUPER_ADMIN_EMAIL: ${{ secrets.TEST_SUPER_ADMIN_EMAIL }}
          TEST_SUPER_ADMIN_PASSWORD: ${{ secrets.TEST_SUPER_ADMIN_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_KEPALA_SEKOLAH_EMAIL: ${{ secrets.TEST_KEPALA_SEKOLAH_EMAIL }}
          TEST_KEPALA_SEKOLAH_PASSWORD: ${{ secrets.TEST_KEPALA_SEKOLAH_PASSWORD }}
          TEST_KETUA_YAYASAN_EMAIL: ${{ secrets.TEST_KETUA_YAYASAN_EMAIL }}
          TEST_KETUA_YAYASAN_PASSWORD: ${{ secrets.TEST_KETUA_YAYASAN_PASSWORD }}
          TEST_GURU_EMAIL: ${{ secrets.TEST_GURU_EMAIL }}
          TEST_GURU_PASSWORD: ${{ secrets.TEST_GURU_PASSWORD }}
          TEST_GURU_NO_CLASS_EMAIL: ${{ secrets.TEST_GURU_NO_CLASS_EMAIL }}
          TEST_GURU_NO_CLASS_PASSWORD: ${{ secrets.TEST_GURU_NO_CLASS_PASSWORD }}
          TEST_UNAUTHORIZED_EMAIL: ${{ secrets.TEST_UNAUTHORIZED_EMAIL }}
          TEST_UNAUTHORIZED_PASSWORD: ${{ secrets.TEST_UNAUTHORIZED_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test tests/browser/p1-80-r5.spec.ts

      - name: Upload Browser Screenshots & Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-80-browser-evidence
          path: |
            tests/browser/screenshots/
            playwright-report/
          retention-days: 14
